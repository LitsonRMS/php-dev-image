name: Build & Publish

on:
  schedule:
    # Run every day at midnight.
    - cron:  '0 0 * * *'

  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        variant: [fpm, frankenphp]

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build_push_step
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./src
          file: ./src/${{ matrix.variant == 'frankenphp' && 'Dockerfile.frankenphp' || 'Dockerfile' }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/litsonrms/php-dev:${{ matrix.variant == 'frankenphp' && 'frankenphp-' || '' }}${{ matrix.php }}
          cache-from: type=gha,scope=php-dev-${{ matrix.variant }}-${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=php-dev-${{ matrix.variant }}-${{ matrix.php }}

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo ${{ steps.build_push_step.outputs.digest }}
